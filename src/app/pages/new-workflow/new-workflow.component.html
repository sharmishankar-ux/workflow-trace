<div class="sample-page">
  <div class="page-eyebrow"><span class="eyebrow-dot"></span> NORTHSTAR WORKSPACE <span class="eyebrow-id">{{ state.activePageLabel.toUpperCase() }}</span></div>
  <section class="title-row"><div><h1>{{ state.activePageLabel }}</h1><p class="page-subtitle">{{ state.activePageDescription }}</p></div><span class="sample-date">Updated just now</span></section>
<section class="sample-card launch-card"><div class="sample-section-heading"><div><h2>Choose a workflow</h2><p>Select a workflow template and provide a name or subject to start a run.</p></div><span class="launch-step">STEP 1 OF 1</span></div>
                    <div class="template-options"><button class="template-option" [class.template-selected]="state.selectedTemplate === 'Customer support escalation'" (click)="state.selectedTemplate = 'Customer support escalation'"><span class="template-icon vendor">◉</span><span><strong>Customer support escalation</strong><small>Review a support case and prepare a grounded response.</small></span><i>✓</i></button><button class="template-option" [class.template-selected]="state.selectedTemplate === 'Product incident review'" (click)="state.selectedTemplate = 'Product incident review'"><span class="template-icon invoice">⌁</span><span><strong>Product incident review</strong><small>Investigate product reports and summarize impact.</small></span><i>✓</i></button><button class="template-option" [class.template-selected]="state.selectedTemplate === 'Knowledge base update'" (click)="state.selectedTemplate = 'Knowledge base update'"><span class="template-icon supplier">✎</span><span><strong>Knowledge base update</strong><small>Draft and verify a helpful support article.</small></span><i>✓</i></button></div>
                    <label class="launch-field"><span><strong>Case or topic</strong><small>Add a support case, product area, or article name.</small></span><input [value]="state.targetName" (input)="state.updateTarget($event)" aria-label="Case or topic" placeholder="For example, Case CS-4812"></label>
                    <div class="launch-footer"><span><i></i> This sample run will appear in workflow history.</span><button class="launch-button" (click)="state.runNewWorkflow()" [disabled]="!state.targetName.trim()">▶ &nbsp;Run workflow</button></div>
                  </section>
</div>
